name: Bot - Zwangsschluss und Abrechnung

# Schließt einen offenen Trade 5 Minuten vor Börsenschluss (15:55 ET = 21:55 Wien) und rechnet den Tag ab.
# Startet 25-30 Minuten vor dem Zwangsschluss, damit eine verspätete Cron-Ausführung nicht schadet.
# Die frühen Zeiten (16:25/17:25 UTC) decken verkürzte Handelstage ab (Börsenschluss 13:00 ET).
on:
  schedule:
    - cron: "25 16 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spy-bot
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      BOT_MODE: ${{ vars.BOT_MODE || 'paper' }}
      RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '0.5' }}
      MAX_LEVERAGE: ${{ vars.MAX_LEVERAGE || '2' }}
      DATA_FEED: ${{ vars.DATA_FEED || 'iex' }}
      LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM }}
      STATE_DIR: state
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Zeitfenster prüfen
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$now" -ge 1200 ] && [ "$now" -le 1700 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "In New York ist es $now Uhr - außerhalb des Abrechnungsfensters, nichts zu tun."
          fi
      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == 'true'
      - name: Zustand laden
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/ci_state.sh pull
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-bot.txt
      - name: Zwangsschluss und Abrechnung
        if: steps.gate.outputs.run == 'true'
        run: python -m backend.cli run-close
      - name: Zustand speichern
        if: always() && steps.gate.outputs.run == 'true'
        run: bash scripts/ci_state.sh push
