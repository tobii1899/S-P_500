name: Bot - Einstiegssuche

# Cron läuft in UTC. Die Zeiten decken Sommer- und Winterzeit ab; der Bot prüft selbst die echte
# New-Yorker Zeit und beendet sich sofort, wenn ein Lauf zur falschen Zeit startet.
# Winter: 14:20 UTC = 9:20 ET = 15:20 Uhr Wien (Start 10 Minuten vor der ersten Auswertung 15:35).
# Weitere Zeiten sind Ersatzläufe, falls GitHub einen Lauf auslässt (der Bot handelt nie doppelt).
on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "50 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "20 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spy-bot
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      BOT_MODE: ${{ vars.BOT_MODE || 'paper' }}
      RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '0.5' }}
      MAX_LEVERAGE: ${{ vars.MAX_LEVERAGE || '2' }}
      DATA_FEED: ${{ vars.DATA_FEED || 'iex' }}
      LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM }}
      STATE_DIR: state
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Zeitfenster prüfen
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$now" -ge 905 ] && [ "$now" -le 1056 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "In New York ist es $now Uhr - außerhalb des Einstiegsfensters, nichts zu tun."
          fi
      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == 'true'
      - name: Zustand laden
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/ci_state.sh pull
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-bot.txt
      - name: Einstiegssuche
        if: steps.gate.outputs.run == 'true'
        run: python -m backend.cli run-session
      - name: Zustand speichern
        if: always() && steps.gate.outputs.run == 'true'
        run: bash scripts/ci_state.sh push
