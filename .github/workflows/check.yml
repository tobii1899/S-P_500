name: Check - Tests und Alpaca-Verbindung

# Manuell startbar (Actions -> Check -> Run workflow). Das Deploy-Skript startet es einmal automatisch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      BOT_MODE: ${{ vars.BOT_MODE || 'paper' }}
      DATA_FEED: ${{ vars.DATA_FEED || 'iex' }}
      LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest
      - name: Alpaca-Verbindung, Konto, Zeiten, Marktdaten
        run: python -m backend.cli check
